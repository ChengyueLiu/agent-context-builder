# Skill：某一类任务怎么做。正文用到时才加载。

items:
  - id: survey
    name: 调研定位
    when_use: 进入调研定位这一步时：检索相关工作，整理相关工作表，提出候选研究问题。
    goal: 弄清这个方向已经做到哪了，找到值得做、也做得动的研究问题。
    practice: |-
      1. 用文献检索工具检索近三年的相关工作，结果先存档再阅读。
      2. 整理相关工作表：方法、数据集、指标、结论、局限。
      3. 从局限里归纳出 2 到 3 个候选研究问题，每个附可行性评估。
    output: 相关工作表和候选研究问题清单，交用户选择。
  - id: idea
    name: 核心想法
    when_use: 进入核心想法这一步时：把研究问题变成可验证的核心想法和论断清单。
  - id: derisk
    name: 快速验证
    when_use: 进入快速验证这一步时：用最小代价的去风险实验检验核心想法是否成立。
  - id: experiment-design
    name: 实验设计
    when_use: 进入实验设计这一步时：把论断清单变成实验方案，跑之前定下支撑与不支撑的标准。
    goal: 把论断清单变成可执行的实验方案，在跑实验之前就定下什么结果算支撑。
    practice: |-
      1. 论断清单逐条列出需要的证据。
      2. 为每条证据设计实验：数据、基线、指标、对照、消融。
      3. 写明停止条件和统计检验方法。
      4. 估算算力和时间，超出预算的标出来交用户决定。
    output: 实验方案，交用户拍板后进入实验执行。
    quality: |-
      - 每条论断都有对应的对照组和必要的消融。
      - 写明评测指标、数据划分和统计检验方法。
      - 写明停止条件：什么结果算支撑、什么算不支撑，在跑实验之前定下。
    pitfalls: |-
      - 不要只在一个数据集上评测：审稿人会质疑泛化性。至少用两个公认的基准。
      - 基线用原论文推荐的超参，或者给基线同样的调参预算：否则提升可能只是调参带来的。
      - 测试集只在最后用一次：反复看测试集，它就变成了验证集。
    examples: |-
      论断：方法 A 在长文本上比基线 B 更稳定。

      - 数据：LongBench 与 SCROLLS 两个基准。
      - 基线：B 用原论文的超参；另给 A 和 B 相同的调参预算各跑一次。
      - 指标：各长度区间的准确率及其方差，5 个随机种子。
      - 支撑的标准：长度超过 8k 的区间，A 的方差显著小于 B（配对检验 p < 0.05）。
      - 不支撑的标准：任一基准上差异不显著。
  - id: experiment
    name: 实验执行
    when_use: 进入实验执行这一步时：按方案运行实验并记录。
    practice: |-
      - 代码遵循项目里已有的风格。

      - 实验配置文件放在 `configs/` 下，一个实验一个文件。
    quality: 关键结果换随机种子至少复跑一次。
  - id: analysis
    name: 结果分析
    when_use: 进入结果分析这一步时：逐条判断论断是否得到支撑，写分析报告。
    practice: 先看它和基线、和直觉是否一致；不一致时先查代码和数据，再下结论。
  - id: writing
    name: 论文写作
    when_use: 进入论文写作这一步时：把论断和证据写成论文初稿。
    goal: 把论断和证据写成审稿人读得懂、挑不出硬伤的初稿。
    practice: |-
      1. 先按论断清单写提纲，每一节对应一条或几条论断。
      2. 图表先行，正文围绕图表写。
      3. 所有数字从结果文件里取，引用从文献库里取。
      4. 写完对照质量标准逐条自查。
    output: |-
      论文用目标会议要求的语言和模板。论文初稿用 LaTeX。

      - 图表用矢量格式，同一篇论文里配色保持一致。
    quality: |-
      - 论文里的每个数字都能在结果文件里找到。
      - 每条论断在正文里都有对应的图表或表格。
      - 局限性一节如实写出没有支撑的论断和已知的问题。
    reference: |-
      ## 科研写作指南

      - Gopen & Swan, *The Science of Scientific Writing*：读者对句子位置的预期，以及如何据此组织段落。
      - 目标会议的作者指南与审稿表。
  - id: review
    name: 复盘
    when_use: 每个阶段结束时、实验失败后、项目结束时。
    goal: 找出结果和预期差在哪、原因是什么，把值得记下的写成经验提议。
    practice: |-
      复盘对照计划和质量标准，回答三个问题：

      1. 结果和预期差在哪。
      2. 是方法错了（做法本身不对），还是执行错了（做法对，但没做到）。
      3. 下次应该怎么做。

      方法错了的，提出修改做法的建议；执行错了的，记成一条提醒。

      复盘时记下自己在哪些事上可靠、在哪些事上常出错，写进经验提议。比如：某类实验的设置经常出错，某个方向的文献容易漏检。
    output: 经验提议，交用户审。方法错了的，附上修改做法的建议。
