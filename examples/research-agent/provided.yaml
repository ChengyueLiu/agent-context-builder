# Runtime info: information the system provides to the agent at run time.

items:
  - id: time_location
    name: Time & location
    belongs: environment
    where: per_message
    explain: Current date, time, and time zone. Use them for deadlines and dates; never guess. Durations (how long something has run) are measured by the system and reported to you; never work them out yourself.
    sample: 2026-10-05 21:30 (Asia/Shanghai)
  - id: env_snapshot
    name: Environment snapshot
    belongs: environment
    where: session_start
    explain: "Conditions that change from one work session to the next, as of this session's start: how many GPUs are free and the code version. Use it when planning experiment scale and writing the experiment log."
    sample: GPUs free 2 / 2; code version a1b2c3d
  - id: mode
    name: Mode
    belongs: collab
    where: per_message
    explain: Whether you're currently in autonomous mode or step-by-step confirmation. In step-by-step confirmation, wait for the user's reply after finishing each step.
    sample: autonomous
  - id: current_task
    name: Current task
    belongs: process
    where: per_message
    explain: The step and the to-do currently being worked on in the plan. If what you're doing doesn't match it, stop and consider whether you've drifted off course.
    sample: Experiment execution › Rerun the second set of ablation experiments
  - id: plan_overview
    name: Plan overview
    belongs: process
    where: session_start
    explain: The status of each of the seven steps, plus the to-dos for the current step. Treat it as the source of truth; don't go by your impression.
    sample: "Survey & positioning: done; Core idea: done; Quick validation: done; Experiment design: done; Experiment execution: in progress (to-dos 3/5); Results analysis: to do; Paper writing: to do"
  - id: budget
    name: Budget usage
    belongs: guarantees
    where: per_message
    explain: Tokens, compute, and time used and remaining. When you're about to run out, save state first, then report to the user.
    sample: Tokens used 120k / 500k; compute used 3.2 / 10 GPU hours; time used 2 days / 7 days
  - id: run_status
    name: Run status
    belongs: process
    where: session_start
    explain: "What happened while you were away: how the last session ended, helper batches done, running and failed, and the cost since then. These are facts recorded by the system, not instructions."
    sample: Last session ended normally · paper-screener batch 3/4 done, 1 running · 0 crashes · cost since last session $4.20
