# Memory management: the key facts the agent keeps in mind, a few sentences each.

items:
  - id: project
    name: Project overview
    scope: project
    path: memory/project.md
    format: The main question, scope and what is out of scope, success criteria, constraints, the research type and the workflow chosen for it; one or two sentences on the rough plan; the user's decisions so far, each with its reason.
    when: When the user confirms the Project brief; after each user decision.
    write: Changes to the research question, target venue, claims, and the user's decisions require the user's consent
    load: auto
    limit: One page at most
  - id: progress
    name: Progress
    scope: project
    path: memory/progress.md
    format: What you're working on now, what happened before (e.g., which experiment failed, what the user rejected), and what you plan to do next, in a few sentences.
    when: After a step ends, after the user decides something, or after an experiment produces an unexpected result.
    write: Can be rewritten
    load: auto
    limit: 10 lines at most
  - id: reference
    name: References
    scope: project
    path: memory/reference.md
    format: "Where to find external information you learned about during the work, one line each: what it is and where it is. For example, datasets, code repositories, and servers the user mentioned."
    when: When the user tells you about, or you find on your own, an information source you'll use again later.
    write: Can be rewritten
    load: on_demand
  - id: user
    name: User
    scope: cross
    path: ~/memory/user.md
    format: The user's research areas, the methods they know well, and how they like to work.
    when: When you learn something new about the user.
    write: Can be rewritten
    load: auto
    limit: 20 lines at most
  - id: feedback
    name: Feedback
    scope: cross
    path: ~/memory/feedback.md
    format: Practices the user has corrected or confirmed, one line each, with the reason.
    when: When the user corrects you, or confirms a non-obvious approach.
    write: Can be rewritten
    load: auto
    limit: 30 lines at most
