# Output management: files the agent produces.

items:
  - id: brief
    name: Project brief
    kind: interim
    skill: alignment
    path: brief.md
    when: Drafted during Alignment and revised after every user answer; confirmed at the end of Alignment; written as a new version on re-alignment.
    format: "Summary, the eleven sections each with its status, the feasibility verdict, and the confirmation stamp `confirmed: <date> (vN)`."
    write: versioned
    confirm: true
  - id: landscape_report
    name: Landscape report
    kind: interim
    skill: literature-review
    path: library/landscape/landscape_report.md
    when: At the end of each Literature review pass. The thesis-scoped pass writes a new version that adds the Thesis neighbourhood section.
    format: Scope & coverage, state of the field, approaches, baselines & evaluation practice, contested points, trends, gaps and positioning hooks, with a paper id on every claim that matters.
    write: versioned
  - id: gap_summary
    name: Gap summary
    kind: interim
    skill: literature-review
    path: library/landscape/gap_summary.md
    when: With the landscape report; the thesis-scoped pass updates the gap the thesis attacks.
    format: Gaps G1, G2, … (coverage or methodological), each with its basis and what it means for this project; Ideation and Approach design read it first.
    write: versioned
  - id: related_reviews
    name: Related reviews table
    kind: interim
    skill: literature-review
    path: library/landscape/related_review_table.csv
    when: While writing the landscape report.
    format: Existing reviews and what each one covers.
    write: edit
  - id: corpus
    name: Corpus
    kind: interim
    skill: literature-review
    path: library/corpus/
    when: Records are added as each search or snowball round arrives; `CORPUS_PAPERS.csv` is regenerated by `prisma_report` after every screening change.
    format: "`records.csv` (everything found, deduplicated), `CORPUS_PAPERS.csv` (the included papers: the one corpus table downstream reads and cites from; never hand-edited), `papers/` (PDFs and `download_report.md`)."
    write: edit
  - id: screening_records
    name: Screening records
    kind: record
    skill: literature-review
    path: library/screening/
    when: The criteria before Pass 1; one decision file per paper as it is judged; `prisma.md` regenerated after every screening change.
    format: "`screening_criteria.json`, `papers/<id>.json` (decision and extraction), and `prisma.md` (the funnel, never hand-edited)."
    write: edit
  - id: snowball_rounds
    name: Snowball rounds
    kind: record
    skill: literature-review
    path: library/snowball/
    when: Each snowball round.
    format: What each round searched and added.
    write: append
  - id: search_archive
    name: Search archive
    kind: record
    skill: literature-review
    path: records/searches/
    when: After every `search_papers` call.
    format: "`searches.csv` (every query: database, string, tag, hits, new records), the raw per-database CSVs, and `search_errors.log` (databases that did not run)."
    write: append
  - id: idea_candidates
    name: Idea candidates
    kind: interim
    skill: ideate
    path: method/candidates.md
    when: Written at the end of Ideation's generate stage, when the full list goes to the user before screening; updated at screen and select.
    format: Every candidate with its six fields, survivors marked, the eliminated table with reasons, and each survivor's novelty verdict (with queries) and reviewer objection.
    write: edit
    confirm: true
  - id: position
    name: Position
    kind: interim
    skill: ideate
    path: method/position.md
    when: At the end of Ideation's select stage; the user picks the thesis.
    format: The thesis, the gap it attacks, the bar (what to beat, on which data, by which metric and margin), why this one, and the runners-up with reconsider-if.
    write: versioned
    confirm: true
  - id: proposal
    name: Proposal
    kind: interim
    skill: approach-design
    path: method/proposal.md
    when: Approach design, thesis stage; revised when the thesis or the complexity budget changes, re-copying the anchor each time.
    format: Problem anchor verbatim, technical gap, method thesis with the smallest-adequate argument, contribution focus, complexity budget, failure modes.
    write: edit
  - id: method_spec
    name: Method spec
    kind: interim
    skill: approach-design
    path: method/method_spec.md
    when: Approach design, spec stage, after the proposal passes its READY gate.
    format: "What to build and measure: components and interfaces with data shapes, algorithm, hyperparameters, metric contract, baselines, failure modes, unknowns."
    write: versioned
  - id: falsification
    name: Falsification plan
    kind: interim
    skill: approach-design
    path: method/falsification.md
    when: Approach design, falsify stage, before any result exists.
    format: Minimal experiment, the pre-registered decision rule (frozen once written), broken-vs-wrong gate, budget, risks with early signals, retreat.
    write: versioned
  - id: data_requirement
    name: Data requirement
    kind: interim
    skill: dataset
    path: dataset/requirement.md
    when: Dataset, need stage, before any dataset is looked at; tightened if decide finds it too loose.
    format: Phenomenon, form, labels/ground truth, constraints, what the field standardly uses, and the search phrasings.
    write: edit
  - id: dataset_candidates
    name: Dataset candidates
    kind: interim
    skill: dataset
    path: dataset/candidates.csv
    when: Dataset, search stage; each `search_datasets` call appends.
    format: "One row per candidate: candidate_id, source, name, url, description, size hint, popularity, licence, tags."
    write: append
  - id: dataset_card
    name: Dataset card
    kind: interim
    skill: dataset
    path: dataset/dataset_card.md
    when: Dataset, decide stage; updated after synthesize.
    format: "The entry point later steps read: what the data is, unit and shape, size, provenance, licence, known biases, public or synthetic, and which parts of the requirement it meets."
    write: edit
  - id: selection_report
    name: Dataset selection report
    kind: interim
    skill: dataset
    path: dataset/selection_report.md
    when: Dataset, decide stage. An abstention goes to the user before any data is built.
    format: Every candidate, kept or rejected, with reason and evidence; abstain true/false with the argument.
    write: edit
  - id: synthetic_strategy
    name: Synthetic data strategy
    kind: interim
    skill: dataset
    path: dataset/synthetic/strategy.md
    when: Dataset, synthesize stage, only after the user agreed to synthetic data; fixed after the prototype batch if needed.
    format: "Markdown design: strategy type, data unit, topology, construction variables, quality rules, contamination controls, datapoint guidance."
    write: edit
  - id: synthetic_datapoints
    name: Synthetic datapoints
    kind: interim
    skill: dataset
    path: dataset/synthetic/
    when: Dataset, synthesize stage, after the strategy and an inspected prototype batch.
    format: "Stimuli only: per-batch raw files merged into datapoints.raw.jsonl, the validated datapoints.jsonl, and the validation report."
    write: edit
  - id: claims
    name: Claims list
    kind: final
    path: claims.md
    when: Entries are added from Literature review onward (Approach design adds the claim to test, with its test); Evaluation changes their status; a frozen copy goes into the package at Deliver.
    format: "One entry per thing known or to prove: status, source, evidence pointer, test, limits, reconsider-if."
    write: edit
  - id: code_readme
    name: Code README
    kind: interim
    skill: implementation
    path: code/README.md
    when: Implementation, scaffold stage, before any code exists; updated whenever an interface changes.
    format: "The entry point to the code: component map, run commands, outputs, metrics contract, config surface, choices, status."
    write: edit
  - id: code
    name: Research code
    kind: interim
    skill: implementation
    path: code/src/
    when: Implementation, build stage, one component at a time; small fixes during Evaluation.
    format: The components, each executed at least once, with the few checks that matter in `code/tests/`.
    write: edit
  - id: code_tests
    name: Critical tests
    kind: interim
    skill: implementation
    path: code/tests/
    when: The build stage of Implementation.
    format: The two or three tests that guard the joins and the metric keys.
    write: edit
  - id: eval_plan
    name: Evaluation plan
    kind: interim
    skill: evaluation
    path: experiments/plan.md
    when: Evaluation, plan stage, before any run.
    format: The pre-registered rule verbatim with its claim id, the run list, gating checks, cost estimate and pilot.
    write: versioned
  - id: code_map
    name: Code map
    kind: interim
    skill: evaluation
    path: experiments/code_map.json
    when: The map stage of Evaluation.
    format: Each experiment's entry point, parameters, and where its results land.
    write: edit
  - id: metrics
    name: Metrics table
    kind: interim
    skill: evaluation
    path: experiments/metrics.csv
    when: After every run, through `record_result`.
    format: One row per claim, run, system, config and metric, with n, status and source.
    write: append
  - id: runs
    name: Run directories
    kind: record
    skill: evaluation
    path: experiments/runs/
    when: One directory per run, written when the run executes.
    format: Each run's `run.py`, `results.json` and stdout log.
    write: append
  - id: eval_summary
    name: Evaluation summary
    kind: interim
    skill: evaluation
    path: experiments/summary.md
    when: Evaluation, read stage, after the rule has been applied.
    format: Runs, gates, numbers against thresholds, verdict, drops, what the result does not license, next step.
    write: versioned
  - id: paper
    name: Paper draft
    kind: final
    skill: writing
    path: paper/
    when: The Paper writing step.
    format: The LaTeX draft in the target venue's template, with figures and tables.
    write: versioned
  - id: references
    name: Bibliography
    kind: interim
    skill: writing
    path: paper/refs.bib
    when: Paper writing, generated by `export_citations` before citing.
    format: BibTeX from the corpus for the papers the draft draws on; unverified entries marked.
    write: edit
  - id: handoff
    name: Handoff
    kind: final
    skill: deliver
    path: deliverables/handoff.md
    when: Deliver; the user approves the whole package (decision point 5) before it leaves the project.
    format: "Six sections: question, what was done, what holds, what does not, what is open, boundaries."
    write: versioned
    confirm: true
  - id: package_references
    name: Package references
    kind: final
    skill: deliver
    path: deliverables/references.bib
    when: Deliver, package stage.
    format: BibTeX from `export_citations` for everything the package cites; unverified entries marked and listed in the handoff.
    write: edit
  - id: manifest
    name: Package manifest
    kind: final
    skill: deliver
    path: deliverables/manifest.md
    when: Deliver, package stage, one line per frozen copy.
    format: "Per item: source path, the claim id it supports, a one-line note."
    write: edit
  - id: lesson_proposals
    name: Lesson proposals
    kind: interim
    skill: review
    path: records/lesson-proposals/
    when: After each retrospective.
    format: "One file per lesson: the rule, why, and how to apply it, noting which project and which experiment it came from. Record both successes and failures."
    write: edit
    confirm: true
  - id: attempts
    name: Attempts & failures
    kind: record
    path: records/attempts.md
    when: When an approach was tried and didn't work.
    format: What was tried and why it didn't work; refer to results by their ID in the experiment log.
    write: append
