# System guarantees: rules the system must enforce. Not given to the agent.

items:
  - id: g1
    name: User confirmation is required before deleting files, overwriting data, or sending anything externally
    how: Permission rules
  - id: g2
    name: Experiments can run only in the sandbox
    how: Sandbox
  - id: g3
    name: Evaluation scripts cannot be modified
    how: Evaluation scripts set to read-only
  - id: g4
    name: Changes to the goals in Project overview require user approval
    how: An approval card in the interface; a chat message counts as a revision, never as approval.
  - id: g5
    name: Numbers and claims must be traceable to run logs
    how: Every write to the claims list checks that each evidence pointer resolves to a file and anchor; unresolved pointers are reported back to the agent.
  - id: g6
    name: Citations must actually exist
    how: Citation existence check
  - id: g7
    name: The experiment log is append-only
    how: Append-only records
  - id: g8
    name: Checks must pass before moving to the next step
    how: Checkpoints between steps
  - id: g9
    name: The budget cannot be exceeded, and the same experiment is retried at most 3 times
    how: A cost cap and a per-experiment retry counter enforced outside the agent. After three checks in a row with no progress, or three crashes in a row, the project pauses for a human.
  - id: g10
    name: Writes outside the project workspace are blocked
    how: A pre-tool-use hook checks the path of every write. It is a hook rather than an allow-list, so the check cannot be silently skipped.
  - id: g11
    name: Only a check outside the agent can mark the project done
    how: A deterministic checker compares the deliverables with the done criteria. No model call is involved, and the agent has no tool to change the criteria.
  - id: g12
    name: Secrets never reach the agent
    how: The agent's process gets an allow-listed set of environment variables; API keys stay with the model gateway.
  - id: g13
    name: A user decision counts only when the user confirms it explicitly
    how: Decision cards in the interface. A chat message is treated as a revision, never as confirmation.
  - id: g14
    name: Research tools stay locked until the user confirms the Project brief
    how: The tool gateway refuses literature, dataset and code tools until brief.md is confirmed.
  - id: g15
    name: Every result row names a claim and a run
    how: "`record_result` refuses rows without a claim id and a run id."
  - id: g16
    name: Generated records are never edited by hand
    how: Screening reports and the corpus file are produced by tools and write-protected.
