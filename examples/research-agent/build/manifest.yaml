agent: Automated Research Agent
language: en
description: Assists researchers from survey and positioning through to a first paper draft, working at the level of a postdoc with an extensive publication record.
note: "Generated by agent-context-builder. Do not edit by hand: edit in the builder, and it is regenerated on save."
given_at_start:
  system_prompt: system-prompt.md
  tools: tools.json
loaded_on_demand:
  workflows:
    - id: claim-route
      name: Claim route
      when: "When the project puts forward a thesis and tests it with experiments: a new method, an empirical finding, or a diagnostic. Not for writing a survey of the literature."
      file: workflows/claim-route.md
  helpers:
    - id: paper-screener
      name: Paper screener
      file: helpers/paper-screener.md
    - id: datapoint-generator
      name: Datapoint generator
      file: helpers/datapoint-generator.md
    - id: component-writer
      name: Component writer
      file: helpers/component-writer.md
    - id: reviewer
      name: Reviewer agent
      file: helpers/reviewer.md
  skills:
    - id: alignment
      name: Alignment
      description: "At the start of every project, before any planning or research: turn the user's request into a confirmed Project brief (`brief.md`). Also when the problem itself must change (narrow, widen or replace the question). Not for: Not for changing how the work is done (that is a plan change), and not for detailed planning or the literature review."
      file: skills/alignment/SKILL.md
    - id: literature-review
      name: Literature review
      description: "After the brief is confirmed, to map existing research on its question: approaches, baselines, evaluation practice, what is established or open. Again after Ideation, scoped to the thesis's neighbourhood, and to screen in a paper that arrives late. Not for: Not for checking a candidate idea's novelty (Ideation) or finding datasets (Dataset)."
      file: skills/literature-review/SKILL.md
      reference: skills/literature-review/reference.md
    - id: ideate
      name: Ideation
      description: "After the literature review: generate candidate theses, each with a falsifiable hypothesis and the cheapest experiment that could refute it; screen them; novelty-check the survivors with real queries; select one. Not for: Not for mapping the literature (Literature review) or turning the thesis into a spec (Approach design)."
      file: skills/ideate/SKILL.md
      reference: skills/ideate/reference.md
    - id: approach-design
      name: Approach design
      description: "After the thesis is chosen and its neighbourhood reviewed: turn it into a method under a complexity budget, freeze a spec someone else can build, and pre-register the rule that decides the claim. Not for: Not for choosing ideas (Ideation), finding data (Dataset), writing code (Implementation) or running the experiment (Evaluation)."
      file: skills/approach-design/SKILL.md
      reference: skills/approach-design/reference.md
    - id: dataset
      name: Dataset
      description: "After Approach design: work out what the data must make observable, search public datasets, judge each for its intended use, and pick one or, with the user's agreement, build a synthetic set. Not for: Not before `method/falsification.md` exists, and never for producing results or model outputs: this step produces stimuli only."
      file: skills/dataset/SKILL.md
      reference: skills/dataset/reference.md
    - id: implementation
      name: Implementation
      description: "After Approach design (and Dataset): turn `method/method_spec.md` into code that runs end to end and writes every metric under the spec's exact keys. Not for: Not for research decisions the spec left open (send them back to Approach design), or for running the full experiment (Evaluation)."
      file: skills/implementation/SKILL.md
    - id: evaluation
      name: Evaluation
      description: "After Implementation: run the pre-registered experiment, record every number against its claim and run, apply the decision rule literally, and update each claim's status. Not for: Not for designing the experiment or setting thresholds (Approach design), substantial code changes (Implementation), or writing up (Paper writing)."
      file: skills/evaluation/SKILL.md
    - id: writing
      name: Paper writing
      description: "After Evaluation: write the claims, the evaluation summary and the method files up into a first paper draft under `paper/`, with every number taken from result files and every citation verified. Not for: Not for deciding whether a claim holds (Evaluation) or assembling the handoff package (Deliver)."
      file: skills/writing/SKILL.md
      reference: skills/writing/reference.md
    - id: deliver
      name: Deliver
      description: "After Paper writing: package what the project established (claims with their evidence, the paper draft, the artifacts worth keeping, verified citations, open questions) into `deliverables/` for the user to approve. Not for: Not for writing the paper or settling open claims, and not a dump of everything the project produced."
      file: skills/deliver/SKILL.md
    - id: review
      name: Retrospective
      description: At the end of each step, after an experiment fails, and at the end of the project.
      file: skills/review/SKILL.md
  knowledge:
    - id: lessons
      name: Lessons
      when: When you face a similar situation, or are about to do the kind of thing you often get wrong. Lessons are for reference only, not rules; when one doesn't fit the current situation, go with the current situation. If it's the kind of thing you often get wrong, slow down, verify more, or ask the user first.
      location: lessons/ (lessons approved by the user, one file each)
    - id: glossary
      name: Glossary
      when: When you are unsure about a term.
      file: knowledge/glossary.md
    - id: ml
      name: Machine learning
      when: "When the research is in machine learning: common benchmarks and metrics, major venues, what counts as a contribution, and common mistakes in the field."
      file: knowledge/ml.md
    - id: experiment-integrity
      name: Experiment integrity
      when: When designing, running, or analyzing an experiment, and before you report any number.
      file: knowledge/experiment-integrity.md
      source: Adapted from merevo's result-integrity and build-discipline references, 2026-08
    - id: claims-list
      name: Claims list
      when: When adding or changing an entry in the Claims list (`claims.md`), and when reading it to decide what is established.
      file: knowledge/claims-list.md
      source: Adapted from merevo's findings ledger (prompts/lead/judgment.md, tools/findings_check.py, docs/design/working-memory-current.md), 2026-10
injected_on_timing:
  reminders:
    - id: step_review
      name: Step finished
      trigger: When a step ends, before moving to the next step.
      file: reminders/step_review.md
    - id: plan_stale
      name: Plan not updated for a while
      trigger: Fires when the plan and to-dos have not been updated for 10 consecutive turns.
      file: reminders/plan_stale.md
    - id: context_full
      name: Context nearly full
      trigger: Fires when context usage exceeds 80%.
      file: reminders/context_full.md
    - id: budget_low
      name: Budget nearly used up
      trigger: Fires when budget usage exceeds 80%.
      file: reminders/budget_low.md
    - id: memory_long
      name: Memory too long
      trigger: Fires when a memory item is close to its length limit.
      file: reminders/memory_long.md
    - id: turn_interrupted
      name: Turn interrupted
      trigger: Fires when your previous turn was interrupted before it finished, for example by a new message from the user.
      file: reminders/turn_interrupted.md
    - id: session_restarted
      name: Session restarted
      trigger: Fires when a session resumes after a crash or restart.
      file: reminders/session_restarted.md
    - id: self_check
      name: Self-check
      trigger: Fires every 4 hours of work, and whenever a batch of helper work finishes.
      file: reminders/self_check.md
    - id: unfinished_stages
      name: Unfinished stages elsewhere
      trigger: Fires when you start a skill while another step's stages are still unfinished.
      file: reminders/unfinished_stages.md
    - id: claims_not_updated
      name: Claims list not updated
      trigger: Fires when a step finishes and the Claims list gained no entries.
      file: reminders/claims_not_updated.md
memory:
  - id: project
    name: Project overview
    scope: project
    path: memory/project.md
    format: The main question, scope and what is out of scope, success criteria, constraints, the research type and the workflow chosen for it; one or two sentences on the rough plan; the user's decisions so far, each with its reason.
    when: When the user confirms the Project brief; after each user decision.
    write: Changes to the research question, target venue, claims, and the user's decisions require the user's consent
    load: auto
    limit: One page at most
  - id: progress
    name: Progress
    scope: project
    path: memory/progress.md
    format: What you're working on now, what happened before (e.g., which experiment failed, what the user rejected), and what you plan to do next, in a few sentences.
    when: After a step ends, after the user decides something, or after an experiment produces an unexpected result.
    write: Can be rewritten
    load: auto
    limit: 10 lines at most
  - id: reference
    name: References
    scope: project
    path: memory/reference.md
    format: "Where to find external information you learned about during the work, one line each: what it is and where it is. For example, datasets, code repositories, and servers the user mentioned."
    when: When the user tells you about, or you find on your own, an information source you'll use again later.
    write: Can be rewritten
    load: on_demand
  - id: user
    name: User
    scope: cross
    path: ~/memory/user.md
    format: The user's research areas, the methods they know well, and how they like to work.
    when: When you learn something new about the user.
    write: Can be rewritten
    load: auto
    limit: 20 lines at most
  - id: feedback
    name: Feedback
    scope: cross
    path: ~/memory/feedback.md
    format: Practices the user has corrected or confirmed, one line each, with the reason.
    when: When the user corrects you, or confirms a non-obvious approach.
    write: Can be rewritten
    load: auto
    limit: 30 lines at most
outputs:
  - id: brief
    name: Project brief
    kind: interim
    skill: alignment
    path: brief.md
    when: Drafted during Alignment and revised after every user answer; confirmed at the end of Alignment; written as a new version on re-alignment.
    format: "Summary, the eleven sections each with its status, the feasibility verdict, and the confirmation stamp `confirmed: <date> (vN)`."
    write: versioned
    confirm: true
  - id: landscape_report
    name: Landscape report
    kind: interim
    skill: literature-review
    path: library/landscape/landscape_report.md
    when: At the end of each Literature review pass. The thesis-scoped pass writes a new version that adds the Thesis neighbourhood section.
    format: Scope & coverage, state of the field, approaches, baselines & evaluation practice, contested points, trends, gaps and positioning hooks, with a paper id on every claim that matters.
    write: versioned
  - id: gap_summary
    name: Gap summary
    kind: interim
    skill: literature-review
    path: library/landscape/gap_summary.md
    when: With the landscape report; the thesis-scoped pass updates the gap the thesis attacks.
    format: Gaps G1, G2, … (coverage or methodological), each with its basis and what it means for this project; Ideation and Approach design read it first.
    write: versioned
  - id: related_reviews
    name: Related reviews table
    kind: interim
    skill: literature-review
    path: library/landscape/related_review_table.csv
    when: While writing the landscape report.
    format: Existing reviews and what each one covers.
    write: edit
  - id: corpus
    name: Corpus
    kind: interim
    skill: literature-review
    path: library/corpus/
    when: Records are added as each search or snowball round arrives; `CORPUS_PAPERS.csv` is regenerated by `prisma_report` after every screening change.
    format: "`records.csv` (everything found, deduplicated), `CORPUS_PAPERS.csv` (the included papers: the one corpus table downstream reads and cites from; never hand-edited), `papers/` (PDFs and `download_report.md`)."
    write: edit
  - id: screening_records
    name: Screening records
    kind: record
    skill: literature-review
    path: library/screening/
    when: The criteria before Pass 1; one decision file per paper as it is judged; `prisma.md` regenerated after every screening change.
    format: "`screening_criteria.json`, `papers/<id>.json` (decision and extraction), and `prisma.md` (the funnel, never hand-edited)."
    write: edit
  - id: snowball_rounds
    name: Snowball rounds
    kind: record
    skill: literature-review
    path: library/snowball/
    when: Each snowball round.
    format: What each round searched and added.
    write: append
  - id: search_archive
    name: Search archive
    kind: record
    skill: literature-review
    path: records/searches/
    when: After every `search_papers` call.
    format: "`searches.csv` (every query: database, string, tag, hits, new records), the raw per-database CSVs, and `search_errors.log` (databases that did not run)."
    write: append
  - id: idea_candidates
    name: Idea candidates
    kind: interim
    skill: ideate
    path: method/candidates.md
    when: Written at the end of Ideation's generate stage, when the full list goes to the user before screening; updated at screen and select.
    format: Every candidate with its six fields, survivors marked, the eliminated table with reasons, and each survivor's novelty verdict (with queries) and reviewer objection.
    write: edit
    confirm: true
  - id: position
    name: Position
    kind: interim
    skill: ideate
    path: method/position.md
    when: At the end of Ideation's select stage; the user picks the thesis.
    format: The thesis, the gap it attacks, the bar (what to beat, on which data, by which metric and margin), why this one, and the runners-up with reconsider-if.
    write: versioned
    confirm: true
  - id: proposal
    name: Proposal
    kind: interim
    skill: approach-design
    path: method/proposal.md
    when: Approach design, thesis stage; revised when the thesis or the complexity budget changes, re-copying the anchor each time.
    format: Problem anchor verbatim, technical gap, method thesis with the smallest-adequate argument, contribution focus, complexity budget, failure modes.
    write: edit
  - id: method_spec
    name: Method spec
    kind: interim
    skill: approach-design
    path: method/method_spec.md
    when: Approach design, spec stage, after the proposal passes its READY gate.
    format: "What to build and measure: components and interfaces with data shapes, algorithm, hyperparameters, metric contract, baselines, failure modes, unknowns."
    write: versioned
  - id: falsification
    name: Falsification plan
    kind: interim
    skill: approach-design
    path: method/falsification.md
    when: Approach design, falsify stage, before any result exists.
    format: Minimal experiment, the pre-registered decision rule (frozen once written), broken-vs-wrong gate, budget, risks with early signals, retreat.
    write: versioned
  - id: data_requirement
    name: Data requirement
    kind: interim
    skill: dataset
    path: dataset/requirement.md
    when: Dataset, need stage, before any dataset is looked at; tightened if decide finds it too loose.
    format: Phenomenon, form, labels/ground truth, constraints, what the field standardly uses, and the search phrasings.
    write: edit
  - id: dataset_candidates
    name: Dataset candidates
    kind: interim
    skill: dataset
    path: dataset/candidates.csv
    when: Dataset, search stage; each `search_datasets` call appends.
    format: "One row per candidate: candidate_id, source, name, url, description, size hint, popularity, licence, tags."
    write: append
  - id: dataset_card
    name: Dataset card
    kind: interim
    skill: dataset
    path: dataset/dataset_card.md
    when: Dataset, decide stage; updated after synthesize.
    format: "The entry point later steps read: what the data is, unit and shape, size, provenance, licence, known biases, public or synthetic, and which parts of the requirement it meets."
    write: edit
  - id: selection_report
    name: Dataset selection report
    kind: interim
    skill: dataset
    path: dataset/selection_report.md
    when: Dataset, decide stage. An abstention goes to the user before any data is built.
    format: Every candidate, kept or rejected, with reason and evidence; abstain true/false with the argument.
    write: edit
  - id: synthetic_strategy
    name: Synthetic data strategy
    kind: interim
    skill: dataset
    path: dataset/synthetic/strategy.md
    when: Dataset, synthesize stage, only after the user agreed to synthetic data; fixed after the prototype batch if needed.
    format: "Markdown design: strategy type, data unit, topology, construction variables, quality rules, contamination controls, datapoint guidance."
    write: edit
  - id: synthetic_datapoints
    name: Synthetic datapoints
    kind: interim
    skill: dataset
    path: dataset/synthetic/
    when: Dataset, synthesize stage, after the strategy and an inspected prototype batch.
    format: "Stimuli only: per-batch raw files merged into datapoints.raw.jsonl, the validated datapoints.jsonl, and the validation report."
    write: edit
  - id: claims
    name: Claims list
    kind: final
    path: claims.md
    when: Entries are added from Literature review onward (Approach design adds the claim to test, with its test); Evaluation changes their status; a frozen copy goes into the package at Deliver.
    format: "One entry per thing known or to prove: status, source, evidence pointer, test, limits, reconsider-if."
    write: edit
  - id: code_readme
    name: Code README
    kind: interim
    skill: implementation
    path: code/README.md
    when: Implementation, scaffold stage, before any code exists; updated whenever an interface changes.
    format: "The entry point to the code: component map, run commands, outputs, metrics contract, config surface, choices, status."
    write: edit
  - id: code
    name: Research code
    kind: interim
    skill: implementation
    path: code/src/
    when: Implementation, build stage, one component at a time; small fixes during Evaluation.
    format: The components, each executed at least once, with the few checks that matter in `code/tests/`.
    write: edit
  - id: code_tests
    name: Critical tests
    kind: interim
    skill: implementation
    path: code/tests/
    when: The build stage of Implementation.
    format: The two or three tests that guard the joins and the metric keys.
    write: edit
  - id: eval_plan
    name: Evaluation plan
    kind: interim
    skill: evaluation
    path: experiments/plan.md
    when: Evaluation, plan stage, before any run.
    format: The pre-registered rule verbatim with its claim id, the run list, gating checks, cost estimate and pilot.
    write: versioned
  - id: code_map
    name: Code map
    kind: interim
    skill: evaluation
    path: experiments/code_map.json
    when: The map stage of Evaluation.
    format: Each experiment's entry point, parameters, and where its results land.
    write: edit
  - id: metrics
    name: Metrics table
    kind: interim
    skill: evaluation
    path: experiments/metrics.csv
    when: After every run, through `record_result`.
    format: One row per claim, run, system, config and metric, with n, status and source.
    write: append
  - id: runs
    name: Run directories
    kind: record
    skill: evaluation
    path: experiments/runs/
    when: One directory per run, written when the run executes.
    format: Each run's `run.py`, `results.json` and stdout log.
    write: append
  - id: eval_summary
    name: Evaluation summary
    kind: interim
    skill: evaluation
    path: experiments/summary.md
    when: Evaluation, read stage, after the rule has been applied.
    format: Runs, gates, numbers against thresholds, verdict, drops, what the result does not license, next step.
    write: versioned
  - id: paper
    name: Paper draft
    kind: final
    skill: writing
    path: paper/
    when: The Paper writing step.
    format: The LaTeX draft in the target venue's template, with figures and tables.
    write: versioned
  - id: references
    name: Bibliography
    kind: interim
    skill: writing
    path: paper/refs.bib
    when: Paper writing, generated by `export_citations` before citing.
    format: BibTeX from the corpus for the papers the draft draws on; unverified entries marked.
    write: edit
  - id: handoff
    name: Handoff
    kind: final
    skill: deliver
    path: deliverables/handoff.md
    when: Deliver; the user approves the whole package (decision point 5) before it leaves the project.
    format: "Six sections: question, what was done, what holds, what does not, what is open, boundaries."
    write: versioned
    confirm: true
  - id: package_references
    name: Package references
    kind: final
    skill: deliver
    path: deliverables/references.bib
    when: Deliver, package stage.
    format: BibTeX from `export_citations` for everything the package cites; unverified entries marked and listed in the handoff.
    write: edit
  - id: manifest
    name: Package manifest
    kind: final
    skill: deliver
    path: deliverables/manifest.md
    when: Deliver, package stage, one line per frozen copy.
    format: "Per item: source path, the claim id it supports, a one-line note."
    write: edit
  - id: lesson_proposals
    name: Lesson proposals
    kind: interim
    skill: review
    path: records/lesson-proposals/
    when: After each retrospective.
    format: "One file per lesson: the rule, why, and how to apply it, noting which project and which experiment it came from. Record both successes and failures."
    write: edit
    confirm: true
  - id: attempts
    name: Attempts & failures
    kind: record
    path: records/attempts.md
    when: When an approach was tried and didn't work.
    format: What was tried and why it didn't work; refer to results by their ID in the experiment log.
    write: append
provided_by_system:
  - id: time_location
    name: Time & location
    belongs: environment
    where: per_message
    explain: Current date, time, and time zone. Use them for deadlines and dates; never guess. Durations (how long something has run) are measured by the system and reported to you; never work them out yourself.
    sample: 2026-10-05 21:30 (Asia/Shanghai)
  - id: env_snapshot
    name: Environment snapshot
    belongs: environment
    where: session_start
    explain: "Conditions that change from one work session to the next, as of this session's start: how many GPUs are free and the code version. Use it when planning experiment scale and writing the experiment log."
    sample: GPUs free 2 / 2; code version a1b2c3d
  - id: mode
    name: Mode
    belongs: collab
    where: per_message
    explain: Whether you're currently in autonomous mode or step-by-step confirmation. In step-by-step confirmation, wait for the user's reply after finishing each step.
    sample: autonomous
  - id: current_task
    name: Current task
    belongs: process
    where: per_message
    explain: The step and the to-do currently being worked on in the plan. If what you're doing doesn't match it, stop and consider whether you've drifted off course.
    sample: Experiment execution › Rerun the second set of ablation experiments
  - id: plan_overview
    name: Plan overview
    belongs: process
    where: session_start
    explain: The status of each of the seven steps, plus the to-dos for the current step. Treat it as the source of truth; don't go by your impression.
    sample: "Survey & positioning: done; Core idea: done; Quick validation: done; Experiment design: done; Experiment execution: in progress (to-dos 3/5); Results analysis: to do; Paper writing: to do"
  - id: budget
    name: Budget usage
    belongs: guarantees
    where: per_message
    explain: Tokens, compute, and time used and remaining. When you're about to run out, save state first, then report to the user.
    sample: Tokens used 120k / 500k; compute used 3.2 / 10 GPU hours; time used 2 days / 7 days
  - id: run_status
    name: Run status
    belongs: process
    where: session_start
    explain: "What happened while you were away: how the last session ended, helper batches done, running and failed, and the cost since then. These are facts recorded by the system, not instructions."
    sample: Last session ended normally · paper-screener batch 3/4 done, 1 running · 0 crashes · cost since last session $4.20
not_in_prompt: {}
not_for_agent:
  guarantees: guarantees.md
  cases: cases.md
