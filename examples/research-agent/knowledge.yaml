# 知识：查阅用的资料，需要时才读。

items:
  - id: lessons
    name: 经验
    when: 遇到相似处境，或者要做自己常出错的那类事时。经验只作参考，不当规则；和当前情况不符时，以当前情况为准。属于常出错的那类事，就放慢、多验证，或者先问用户。
    form: elsewhere
    location: lessons/（用户批准过的经验，每条一个文件）
  - id: glossary
    name: 术语表
    when: 遇到不确定的术语时。
    form: inline
    content: |-
      - 论断清单：论文要证明的若干条结论，每条附所需的证据。
      - 去风险实验：花最小代价验证核心想法是否成立的快速实验。
      - 检查点：阶段之间的关口，通过才进入下一阶段。
  - id: ml
    name: 机器学习
    when: 研究属于机器学习领域时：常用基准与指标、主要会议、什么算贡献、领域内容易犯的错误。
    form: inline
    content: |-
      ### 常用基准与指标
      - 语言建模：困惑度；长文本：LongBench、SCROLLS。
      - 分类：准确率、宏 F1。

      ### 主要会议
      NeurIPS、ICML、ICLR。

      ### 什么算贡献
      - 新方法：在公认基准上超过强基线，并有消融说明每个部分的作用。
      - 新发现：有系统的实验支撑，排除了更简单的解释。
      - 新基准或数据集：说明现有基准的缺陷，以及新基准如何弥补。

      ### 容易犯的错
      - 类别不平衡时准确率会误导，同时报告宏 F1 或按类别的指标。
      - 小数据集上的提升要报方差：单次运行的提升可能只是噪声。
