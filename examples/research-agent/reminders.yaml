# 自动提醒：系统到点插入的提醒，由 agent 去做。

items:
  - id: step_review
    name: 一步结束
    trigger: 一步结束、进入下一步之前。
    text: 这一步结束了。进入下一步之前，按「复盘」skill 复盘这一步，把值得记下的写成经验提议，并更新进展。
  - id: plan_stale
    name: 规划久未更新
    trigger: 规划和待办连续 10 轮没有更新时触发。
    text: 规划和待办很久没有更新了。先回头看一眼规划，确认手上的事还在为研究问题服务；如果卡住了，把这一项标成受阻，向用户汇报或调整计划。
  - id: context_full
    name: 上下文将满
    trigger: 上下文占用超过 80% 时触发。
    text: 上下文快满了。请先更新进展，把重要发现写进工作记录，压缩之后从进展接着做。
  - id: budget_low
    name: 预算将尽
    trigger: 已用预算超过 80% 时触发。
    text: 预算即将用完。请保存当前状态，向用户汇报进展和剩余的工作，等用户决定是否追加预算。
  - id: memory_long
    name: 记忆超长
    trigger: 某样记忆快超过它的长度上限时触发。
    text: 记忆快超长了。请压缩：只留要点，细节挪进工作记录。
